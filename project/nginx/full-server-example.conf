# ============================================================
# VÍ DỤ đầy đủ: 1 domain phục vụ NHIỀU project qua sub-path.
# File này minh hoạ cách ghép nhiều project (video-call, chat-app...)
# vào cùng 1 server block. Đặt tại /etc/nginx/sites-available/<domain>
# rồi symlink sang sites-enabled.
# ============================================================

# --- Đặt 1 LẦN DUY NHẤT ở ngoài server{}, thường trong /etc/nginx/nginx.conf
# hoặc 1 file riêng trong conf.d/, KHÔNG lặp lại trong mỗi site ---
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }

server {
    listen 80;
    server_name your-domain.com;

    # ---------------- project: video-call (PORT 4000) ----------------
    location /video-call/ {
        alias /var/www/video-call/frontend/dist/;
        try_files $uri $uri/ /video-call/index.html;
    }

    location = /video-call {
        return 301 /video-call/;
    }

    location /video-call/api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /video-call/socket.io/ {
        proxy_pass http://127.0.0.1:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------------- project: chat-app (PORT 4001) — ví dụ project thứ 2 ----
    # Y hệt cấu trúc trên, chỉ đổi sub-path và port:
    #
    # location /chat-app/ {
    #     alias /var/www/chat-app/frontend/dist/;
    #     try_files $uri $uri/ /chat-app/index.html;
    # }
    # location = /chat-app { return 301 /chat-app/; }
    # location /chat-app/api/ {
    #     proxy_pass http://127.0.0.1:4001/api/;
    #     ... (các header giống trên)
    # }
    # location /chat-app/socket.io/ {
    #     proxy_pass http://127.0.0.1:4001/socket.io/;
    #     ... (các header giống trên)
    # }

    # ---------------- (tuỳ chọn) trang chủ / danh sách project --------
    # location = / {
    #     return 200 'OK - see /video-call, /chat-app, ...';
    # }
}
