# ============================================================
# Nginx config mẫu cho project "video-call", chạy dưới sub-path
# /video-call trên một domain dùng chung cho nhiều project.
#
# Cách dùng: copy nội dung 3 block "location" bên dưới vào TRONG
# block `server { ... }` chính của domain bạn (thường ở
# /etc/nginx/sites-available/<domain>), cạnh các location của các
# project khác (/chat-app, /shop-app, ...).
#
# Backend của project này chạy ở PORT=4000 (đổi theo .env thực tế).
# Mỗi project trên VPS phải dùng PORT khác nhau.
# ============================================================

    # ---- 1. Frontend tĩnh (React/Vite build) ----
    # Serve toàn bộ file tĩnh trong thư mục dist/ tại /video-call/*
    location /video-call/ {
        alias /var/www/video-call/frontend/dist/;
        try_files $uri $uri/ /video-call/index.html;
    }

    # Redirect /video-call (thiếu dấu / cuối) -> /video-call/
    # để tránh lỗi resolve asset path tương đối.
    location = /video-call {
        return 301 /video-call/;
    }

    # ---- 2. API backend ----
    # Nginx strip prefix "/video-call" trước khi forward, nên backend
    # Express chỉ thấy "/api/...". Ví dụ:
    #   client gọi:  /video-call/api/health
    #   backend nhận: /api/health
    location /video-call/api/ {
        proxy_pass http://127.0.0.1:4000/api/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 3. Socket.IO (WebSocket) ----
    # Bắt buộc phải có Upgrade/Connection header để WebSocket hoạt động,
    # nếu không Socket.IO sẽ tự rớt về long-polling (vẫn chạy được
    # nhưng chậm hơn và không phải WS thật).
    location /video-call/socket.io/ {
        proxy_pass http://127.0.0.1:4000/socket.io/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Giữ kết nối lâu cho WebSocket (mặc định nginx timeout 60s là
        # quá ngắn cho video call/chat kéo dài).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
